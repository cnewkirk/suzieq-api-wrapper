name: Feature request
description: New table, missing parameter, or other enhancement
labels: [enhancement]
body:
  - type: checkboxes
    attributes:
      label: Pre-flight
      options:
        - label: I searched existing issues and this hasn't been requested yet
          required: true

  - type: textarea
    id: missing
    attributes:
      label: What table or feature is missing?
      description: >
        Link to the SuzieQ REST API docs if relevant:
        https://suzieq.readthedocs.io/en/latest/rest-server/
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed method signature
      description: What should the method look like and what should it return?
      render: python
      placeholder: |
        # e.g.
        client.show_newtable(namespace=None, hostname=None) -> list[dict]
    validations:
      required: false

  - type: input
    id: suzieq_version
    attributes:
      label: SuzieQ version where this table/feature exists
      placeholder: "e.g. 0.22.0+"
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Use case, workaround you're using today, anything else helpful.
    validations:
      required: false
